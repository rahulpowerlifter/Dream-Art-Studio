<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DREAM ART STUDIO - Client Photo Selection</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { background-color: #0f0f11; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; }
    .selected-ring { box-shadow: 0 0 0 3px #f43f5e; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-zinc-950/90 backdrop-blur border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
    <div>
      <h1 id="studioTitle" class="text-lg font-bold tracking-wide text-white">DREAM ART STUDIO</h1>
      <p id="subTitle" class="text-xs text-zinc-400">Client Photo Selection</p>
    </div>
    <div id="headerActions" class="flex items-center gap-3"></div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto p-4"></main>

  <!-- LIGHTBOX MODAL -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-black/95 hidden flex-col items-center justify-center p-4">
    <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-lg text-sm">✕ Close</button>
    <img id="lightboxImg" src="" class="max-h-[80vh] max-w-[95vw] object-contain rounded-lg select-none" />
    <div class="mt-4 flex items-center gap-4">
      <button onclick="prevPhoto()" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg text-sm">← Prev</button>
      <button id="lightboxSelectBtn" onclick="toggleCurrentLightboxSelect()" class="px-5 py-2 rounded-lg font-semibold text-sm bg-zinc-800 hover:bg-rose-600 transition">♥ Select</button>
      <button onclick="nextPhoto()" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg text-sm">Next →</button>
    </div>
    <p id="lightboxFilename" class="mt-2 text-xs text-zinc-400"></p>
  </div>

  <!-- APP LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, getDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =========================================================
    // 1. CONFIG SECTION
    // =========================================================
    const STUDIO_NAME = "DREAM ART STUDIO";
    const ADMIN_PASSWORD = "anbeshivam@1";

    const CLOUDINARY_CLOUD_NAME = "cmaowgef";
    const CLOUDINARY_UPLOAD_PRESET = "dream art studio"; // <-- Unoda Cloudinary Unsigned Preset peru correct-ah iruka-nu check panniko!

    const firebaseConfig = {
      apiKey: "AIzaSyAaYi8m6b0AbsBGtkmM-jF5Owr_5SLTZqo",
      authDomain: "dream-art-studio.firebaseapp.com",
      projectId: "dream-art-studio",
      storageBucket: "dream-art-studio.firebasestorage.app",
      messagingSenderId: "1046270418292",
      appId: "1:1046270418292:web:18d46c6717fe26b41ba021",
      measurementId: "G-ESSL2X18YD"
    };
    // =========================================================

    document.getElementById("studioTitle").innerText = STUDIO_NAME;
    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    const params = new URLSearchParams(window.location.search);
    const isAdmin = params.get("admin") === "true";
    const galleryId = params.get("gallery");

    let currentGallery = null;
    let selectedSet = new Set();
    let lightboxIndex = 0;

    // =========================================================
    // AUTO-COMPRESS FUNCTION (Shrinks large JPGs to ~200KB HD)
    // =========================================================
    function compressImage(file, maxDimension = 1600, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height && width > maxDimension) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else if (height > maxDimension) {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(
              (blob) => {
                if (blob) resolve(blob);
                else reject(new Error("Compression failed"));
              },
              "image/jpeg",
              quality
            );
          };
          img.onerror = () => reject(new Error("Invalid image file"));
        };
        reader.onerror = () => reject(new Error("File read failed"));
      });
    }

    // =========================================================
    // ROUTER
    // =========================================================
    if (isAdmin) {
      renderAdminLogin();
    } else if (galleryId) {
      loadClientGallery(galleryId);
    } else {
      document.getElementById("app").innerHTML = `
        <div class="text-center py-24">
          <h2 class="text-2xl font-bold text-white mb-2">Welcome to ${STUDIO_NAME}</h2>
          <p class="text-zinc-400 text-sm">Please use the private gallery link shared by your photographer.</p>
          <a href="?admin=true" class="inline-block mt-8 text-xs text-zinc-600 hover:text-zinc-300 underline">Photographer Admin Login</a>
        </div>
      `;
    }

    // =========================================================
    // ADMIN SECTION
    // =========================================================
    function renderAdminLogin() {
      if (sessionStorage.getItem("adminAuth") === "true") {
        renderAdminDashboard();
        return;
      }
      document.getElementById("app").innerHTML = `
        <div class="max-w-sm mx-auto mt-20 bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
          <h2 class="text-lg font-bold mb-4 text-center">Admin Login</h2>
          <input id="adminPassInput" type="password" placeholder="Enter Admin Password" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm mb-3 outline-none focus:border-rose-500" />
          <button id="loginBtn" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2 rounded-lg text-sm transition">Login</button>
        </div>
      `;
      document.getElementById("loginBtn").onclick = () => {
        if (document.getElementById("adminPassInput").value === ADMIN_PASSWORD) {
          sessionStorage.setItem("adminAuth", "true");
          renderAdminDashboard();
        } else {
          alert("Wrong password!");
        }
      };
    }

    async function renderAdminDashboard() {
      document.getElementById("subTitle").innerText = "Admin Dashboard";
      document.getElementById("app").innerHTML = `
        <div class="grid md:grid-cols-3 gap-6">
          <!-- CREATE GALLERY FORM -->
          <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl h-fit">
            <h2 class="text-base font-bold mb-4">Create New Client Gallery</h2>
            <div class="space-y-3">
              <div>
                <label class="text-xs text-zinc-400">Client / Event Name</label>
                <input id="clientName" type="text" placeholder="e.g. Karthik & Priya Wedding" class="w-full mt-1 bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-rose-500" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-xs text-zinc-400">4-Digit PIN</label>
                  <input id="clientPin" type="text" placeholder="1234" class="w-full mt-1 bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-rose-500" />
                </div>
                <div>
                  <label class="text-xs text-zinc-400">Max Limit</label>
                  <input id="maxLimit" type="number" value="150" class="w-full mt-1 bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-rose-500" />
                </div>
              </div>
              <div>
                <label class="text-xs text-zinc-400">Select Photos (Auto-Compress Enabled)</label>
                <input id="photoFiles" type="file" multiple accept="image/*" class="w-full mt-1 text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-zinc-800 file:text-white hover:file:bg-zinc-700 cursor-pointer" />
              </div>
              <button id="uploadBtn" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 rounded-lg text-sm transition">Upload & Create Gallery</button>
              <p id="uploadStatus" class="text-xs text-amber-400 text-center hidden"></p>
            </div>
          </div>

          <!-- EXISTING GALLERIES LIST -->
          <div class="md:col-span-2 bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
            <h2 class="text-base font-bold mb-4">Client Galleries</h2>
            <div id="galleriesList" class="space-y-3 text-sm text-zinc-400">Loading...</div>
          </div>
        </div>
      `;

      document.getElementById("uploadBtn").onclick = handleCreateGallery;
      loadAdminGalleries();
    }

    async function handleCreateGallery() {
      const name = document.getElementById("clientName").value.trim();
      const pin = document.getElementById("clientPin").value.trim();
      const maxLimit = parseInt(document.getElementById("maxLimit").value) || 150;
      const files = document.getElementById("photoFiles").files;
      const statusEl = document.getElementById("uploadStatus");
      const btn = document.getElementById("uploadBtn");

      if (!name || !pin || files.length === 0) {
        alert("Please fill Client Name, PIN, and select at least 1 photo.");
        return;
      }

      btn.disabled = true;
      btn.classList.add("opacity-50");
      statusEl.classList.remove("hidden");

      const uploadedPhotos = [];
      let failedCount = 0;
      let lastError = "";

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusEl.innerText = `Compressing & Uploading ${i + 1} / ${files.length} (${file.name})...`;

        try {
          const compressedBlob = await compressImage(file);
          const formData = new FormData();
          formData.append("file", compressedBlob, file.name);
          formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
            method: "POST",
            body: formData
          });
          const data = await res.json();

          if (data.secure_url) {
            uploadedPhotos.push({
              url: data.secure_url,
              filename: file.name
            });
          } else {
            failedCount++;
            lastError = data.error ? data.error.message : "Upload rejected by Cloudinary";
          }
        } catch (err) {
          failedCount++;
          lastError = err.message;
        }
      }

      if (uploadedPhotos.length === 0) {
        alert(`Upload Failed! Reason: ${lastError}\n\nCheck your CLOUDINARY_UPLOAD_PRESET name in index.html.`);
        statusEl.classList.add("hidden");
        btn.disabled = false;
        btn.classList.remove("opacity-50");
        return;
      }

      statusEl.innerText = "Saving gallery to database...";
      await addDoc(collection(db, "galleries"), {
        name,
        pin,
        maxLimit,
        photos: uploadedPhotos,
        selected: [],
        submitted: false,
        createdAt: Date.now()
      });

      alert(`Gallery Created! ${uploadedPhotos.length} photos uploaded.` + (failedCount > 0 ? ` (${failedCount} failed)` : ""));
      renderAdminDashboard();
    }

    async function loadAdminGalleries() {
      const listEl = document.getElementById("galleriesList");
      const snap = await getDocs(collection(db, "galleries"));
      if (snap.empty) {
        listEl.innerHTML = `<p class="text-zinc-500">No galleries yet.</p>`;
        return;
      }

      const items = [];
      snap.forEach(d => items.push({ id: d.id, ...d.data() }));
      items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      listEl.innerHTML = items.map(g => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?gallery=${g.id}`;
        const selCount = (g.selected || []).length;
        const badge = g.submitted
          ? `<span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded-full">Submitted</span>`
          : `<span class="bg-amber-500/20 text-amber-400 text-xs px-2 py-0.5 rounded-full">In Progress</span>`;

        return `
          <div class="bg-zinc-950 border border-zinc-800 p-4 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="font-bold text-white">${g.name}</h3>
                ${badge}
              </div>
              <p class="text-xs text-zinc-400 mt-1">PIN: <span class="text-white">${g.pin}</span> • Photos: ${g.photos.length} • Selected: <span class="text-rose-400 font-semibold">${selCount} / ${g.maxLimit}</span></p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="copyLink('${shareUrl}')" class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs px-3 py-1.5 rounded-lg">Copy Client Link</button>
              <button onclick="exportLightroom('${g.id}')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg">Export Filenames</button>
              <button onclick="deleteGallery('${g.id}')" class="bg-red-900/50 hover:bg-red-700 text-red-200 text-xs px-3 py-1.5 rounded-lg">Delete</button>
            </div>
          </div>
        `;
      }).join("");
    }

    window.copyLink = (url) => {
      navigator.clipboard.writeText(url);
      alert("Client link copied! Share it on WhatsApp.");
    };

    window.exportLightroom = async (id) => {
      const snap = await getDoc(doc(db, "galleries", id));
      if (!snap.exists()) return;
      const g = snap.data();
      const selected = g.selected || [];
      if (selected.length === 0) {
        alert("Client hasn't selected any photos yet.");
        return;
      }
      const lightroomList = selected.map(f => f.replace(/\.[^/.]+$/, "")).join(", ");
      navigator.clipboard.writeText(lightroomList);
      alert(`Copied ${selected.length} filenames for Lightroom!\n\nPaste directly into Lightroom's Text Filter (Library -> Filter -> Text -> Filename -> Contains):\n\n${lightroomList}`);
    };

    window.deleteGallery = async (id) => {
      if (!confirm("Delete this gallery from dashboard?")) return;
      await deleteDoc(doc(db, "galleries", id));
      loadAdminGalleries();
    };

    // =========================================================
    // CLIENT SECTION
    // =========================================================
    async function loadClientGallery(id) {
      const snap = await getDoc(doc(db, "galleries", id));
      if (!snap.exists()) {
        document.getElementById("app").innerHTML = `<p class="text-center py-20 text-zinc-400">Gallery not found.</p>`;
        return;
      }
      currentGallery = { id: snap.id, ...snap.data() };
      selectedSet = new Set(currentGallery.selected || []);
      document.getElementById("subTitle").innerText = currentGallery.name;

      renderPinScreen();
    }

    function renderPinScreen() {
      document.getElementById("app").innerHTML = `
        <div class="max-w-sm mx-auto mt-20 bg-zinc-900 border border-zinc-800 p-6 rounded-2xl text-center">
          <h2 class="text-lg font-bold text-white mb-1">${currentGallery.name}</h2>
          <p class="text-xs text-zinc-400 mb-4">Enter 4-digit PIN to view your photos</p>
          <input id="pinInput" type="password" maxlength="6" placeholder="Enter PIN" class="w-full text-center tracking-widest bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-lg mb-3 outline-none focus:border-rose-500" />
          <button id="unlockBtn" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2 rounded-lg text-sm">Open Gallery</button>
        </div>
      `;
      document.getElementById("unlockBtn").onclick = () => {
        if (document.getElementById("pinInput").value.trim() === currentGallery.pin) {
          renderClientPhotos();
        } else {
          alert("Incorrect PIN!");
        }
      };
    }

    function renderClientPhotos() {
      updateClientHeader();
      const photos = currentGallery.photos || [];

      if (photos.length === 0) {
        document.getElementById("app").innerHTML = `<p class="text-center py-20 text-zinc-400">No photos in this gallery yet.</p>`;
        return;
      }

      document.getElementById("app").innerHTML = `
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
          ${photos.map((p, idx) => {
            const isSel = selectedSet.has(p.filename);
            return `
              <div id="card-${idx}" class="relative group bg-zinc-900 rounded-xl overflow-hidden cursor-pointer ${isSel ? 'selected-ring' : ''}">
                <img src="${p.url}" loading="lazy" onclick="openLightbox(${idx})" class="w-full aspect-square object-cover hover:opacity-90 transition" />
                <button onclick="toggleSelect(${idx}, event)" class="absolute top-2 right-2 w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-lg transition ${isSel ? 'bg-rose-600 text-white' : 'bg-black/60 text-white hover:bg-rose-600'}">
                  ♥
                </button>
                <div class="px-2 py-1 text-[10px] text-zinc-400 truncate bg-zinc-950/80">${p.filename}</div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function updateClientHeader() {
      const count = selectedSet.size;
      const limit = currentGallery.maxLimit;
      document.getElementById("headerActions").innerHTML = `
        <div class="bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-lg text-xs font-semibold">
          <span class="${count > limit ? 'text-amber-400' : 'text-rose-400'}">${count}</span> / ${limit} Selected
        </div>
        <button onclick="submitSelection()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-4 py-1.5 rounded-lg transition">
          ${currentGallery.submitted ? 'Update Submit' : 'Final Submit'}
        </button>
      `;
    }

    window.toggleSelect = async (idx, e) => {
      if (e) e.stopPropagation();
      const filename = currentGallery.photos[idx].filename;
      if (selectedSet.has(filename)) {
        selectedSet.delete(filename);
      } else {
        if (selectedSet.size >= currentGallery.maxLimit) {
          alert(`You have reached the maximum limit of ${currentGallery.maxLimit} photos.`);
          return;
        }
        selectedSet.add(filename);
      }
      renderClientPhotos();
      await updateDoc(doc(db, "galleries", currentGallery.id), {
        selected: Array.from(selectedSet)
      });
    };

    window.submitSelection = async () => {
      if (!confirm(`Submit ${selectedSet.size} selected photos to ${STUDIO_NAME}?`)) return;
      await updateDoc(doc(db, "galleries", currentGallery.id), {
        selected: Array.from(selectedSet),
        submitted: true
      });
      currentGallery.submitted = true;
      updateClientHeader();
      alert("Thank you! Your photo selection has been submitted.");
    };

    // =========================================================
    // LIGHTBOX
    // =========================================================
    window.openLightbox = (idx) => {
      lightboxIndex = idx;
      updateLightboxUI();
      document.getElementById("lightbox").classList.remove("hidden");
      document.getElementById("lightbox").classList.add("flex");
    };

    window.closeLightbox = () => {
      document.getElementById("lightbox").classList.add("hidden");
      document.getElementById("lightbox").classList.remove("flex");
    };

    window.prevPhoto = () => {
      lightboxIndex = (lightboxIndex - 1 + currentGallery.photos.length) % currentGallery.photos.length;
      updateLightboxUI();
    };

    window.nextPhoto = () => {
      lightboxIndex = (lightboxIndex + 1) % currentGallery.photos.length;
      updateLightboxUI();
    };

    window.toggleCurrentLightboxSelect = async () => {
      await window.toggleSelect(lightboxIndex);
      updateLightboxUI();
    };

    function updateLightboxUI() {
      const p = currentGallery.photos[lightboxIndex];
      document.getElementById("lightboxImg").src = p.url;
      document.getElementById("lightboxFilename").innerText = `${p.filename} (${lightboxIndex + 1} / ${currentGallery.photos.length})`;
      const btn = document.getElementById("lightboxSelectBtn");
      if (selectedSet.has(p.filename)) {
        btn.innerText = "♥ Selected";
        btn.className = "px-5 py-2 rounded-lg font-semibold text-sm bg-rose-600 text-white transition";
      } else {
        btn.innerText = "♥ Select";
        btn.className = "px-5 py-2 rounded-lg font-semibold text-sm bg-zinc-800 hover:bg-rose-600 transition";
      }
    }
  </script>
</body>
</html>
