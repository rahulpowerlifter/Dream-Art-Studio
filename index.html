<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DREAM ART STUDIO — Private Gallery</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#09090b" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
      background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08), transparent 45%);
    }
    .font-serif-luxury { font-family: 'Cormorant Garamond', serif; letter-spacing: 0.08em; }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .gold-gradient {
      background: linear-gradient(135deg, #e5c158 0%, #b8860b 100%);
    }
    .selected-ring {
      box-shadow: 0 0 0 2px #d4af37, 0 10px 25px -5px rgba(212, 175, 55, 0.35);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-500/30 selection:text-amber-200">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-zinc-950/80 backdrop-blur-xl border-b border-white/10 px-4 sm:px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img id="headerLogo" src="" alt="Studio Logo" class="h-9 w-auto object-contain hidden" />
      <div>
        <h1 id="studioTitle" class="font-serif-luxury text-lg sm:text-xl font-bold tracking-wider text-white">DREAM ART STUDIO</h1>
        <p id="subTitle" class="text-[11px] uppercase tracking-[0.2em] text-amber-400/80">Private Client Gallery</p>
      </div>
    </div>
    <div id="headerActions" class="flex items-center gap-2 sm:gap-3"></div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6"></main>

  <!-- LIGHTBOX MODAL -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden flex-col items-center justify-center p-4">
    <button onclick="closeLightbox()" class="absolute top-4 right-4 text-zinc-300 hover:text-white bg-white/10 hover:bg-white/20 px-3.5 py-1.5 rounded-full text-xs tracking-wider uppercase transition">✕ Close</button>
    <img id="lightboxImg" src="" class="max-h-[75vh] max-w-[94vw] object-contain rounded-lg shadow-2xl select-none" />
    <div class="mt-5 flex flex-wrap items-center justify-center gap-2.5 sm:gap-3">
      <button onclick="prevPhoto()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full text-xs uppercase tracking-wider transition cursor-pointer">← Prev</button>
      <button id="lightboxSelectBtn" onclick="toggleCurrentLightboxSelect()" class="px-5 py-2 rounded-full font-semibold text-xs uppercase tracking-wider transition cursor-pointer">♥ Select</button>
      <button id="lightboxStarBtn" onclick="toggleCurrentLightboxStar()" class="px-5 py-2 rounded-full font-semibold text-xs uppercase tracking-wider transition cursor-pointer">★ Cover / Frame</button>
      <button onclick="nextPhoto()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full text-xs uppercase tracking-wider transition cursor-pointer">Next →</button>
    </div>
    <p id="lightboxFilename" class="mt-3 text-xs text-zinc-400 tracking-wide"></p>
  </div>

  <!-- APP LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, getDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =========================================================
    // 1. CONFIG SECTION
    // =========================================================
    const STUDIO_NAME = "DREAM ART STUDIO";
    const STUDIO_LOGO_URL = "https://res.cloudinary.com/cmaowgef/image/upload/v1795406490/Da_2_Dream_art_studio.png";
    const ADMIN_PASSWORD = "anbeshivam@1";

    const CLOUDINARY_CLOUD_NAME = "cmaowgef";
    const CLOUDINARY_UPLOAD_PRESET = "dream art studio";

    const firebaseConfig = {
      apiKey: "AIzaSyAaYi8m6b0AbsBGtkmM-jF5Owr_5SLTZqo",
      authDomain: "dream-art-studio.firebaseapp.com",
      projectId: "dream-art-studio",
      storageBucket: "dream-art-studio.firebasestorage.app",
      messagingSenderId: "1046270418292",
      appId: "1:1046270418292:web:18d46c6717fe26b41ba021",
      measurementId: "G-ESSL2X18YD"
    };
    // =========================================================

    document.getElementById("studioTitle").innerText = STUDIO_NAME;
    if (STUDIO_LOGO_URL) {
      const logoEl = document.getElementById("headerLogo");
      logoEl.src = STUDIO_LOGO_URL;
      logoEl.classList.remove("hidden");
    }

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    const params = new URLSearchParams(window.location.search);
    const isAdmin = params.get("admin") === "true";
    const galleryId = params.get("gallery");

    let currentGallery = null;
    let selectedSet = new Set();
    let starredSet = new Set();
    let lightboxIndex = 0;
    let activeFilter = "all"; // "all", "selected", or "starred"

    function getLogoHtml(sizeClass = "h-16") {
      return STUDIO_LOGO_URL
        ? `<img src="${STUDIO_LOGO_URL}" alt="${STUDIO_NAME}" class="${sizeClass} mx-auto mb-4 object-contain drop-shadow-lg" />`
        : `<div class="w-12 h-12 mx-auto mb-4 rounded-full gold-gradient flex items-center justify-center text-black font-serif-luxury font-bold text-xl shadow-lg">D</div>`;
    }

    // =========================================================
    // AUTO-COMPRESS + STUDIO WATERMARK
    // =========================================================
    function compressImage(file, maxDimension = 1600, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > height && width > maxDimension) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else if (height > maxDimension) {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            // --- STUDIO WATERMARK ---
            ctx.save();
            const fontSize = Math.max(24, Math.floor(width / 15));
            ctx.font = `600 ${fontSize}px sans-serif`;
            ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
            ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
            ctx.shadowBlur = 4;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.translate(width / 2, height / 2);
            ctx.rotate(-Math.PI / 6);
            ctx.fillText(STUDIO_NAME, 0, 0);
            ctx.restore();

            canvas.toBlob(
              (blob) => (blob ? resolve(blob) : reject(new Error("Compression failed"))),
              "image/jpeg",
              quality
            );
          };
          img.onerror = () => reject(new Error("Invalid image file"));
        };
        reader.onerror = () => reject(new Error("File read failed"));
      });
    }

    // =========================================================
    // ROUTER
    // =========================================================
    if (isAdmin) {
      renderAdminLogin();
    } else if (galleryId) {
      loadClientGallery(galleryId);
    } else {
      document.getElementById("app").innerHTML = `
        <div class="max-w-md mx-auto text-center py-24 px-4">
          ${getLogoHtml("h-20")}
          <p class="text-xs uppercase tracking-[0.3em] text-amber-400/90 mb-2">Exclusive Proofing Portal</p>
          <h2 class="font-serif-luxury text-3xl sm:text-4xl font-bold text-white mb-3">${STUDIO_NAME}</h2>
          <p class="text-zinc-400 text-sm leading-relaxed">Please use the private gallery link shared by your photographer to view and select your memories.</p>
          <div class="mt-10 pt-6 border-t border-white/10">
            <a href="?admin=true" class="text-xs text-zinc-500 hover:text-amber-400 tracking-wider uppercase transition">Photographer Admin Login →</a>
          </div>
        </div>
      `;
    }

    // =========================================================
    // ADMIN SECTION
    // =========================================================
    function renderAdminLogin() {
      if (sessionStorage.getItem("adminAuth") === "true") {
        renderAdminDashboard();
        return;
      }
      document.getElementById("app").innerHTML = `
        <div class="max-w-sm mx-auto mt-16 glass-card p-8 rounded-3xl text-center">
          ${getLogoHtml("h-14")}
          <h2 class="font-serif-luxury text-2xl font-bold mb-1">Studio Admin</h2>
          <p class="text-xs text-zinc-400 mb-6">Enter your secret password to manage galleries</p>
          <input id="adminPassInput" type="password" placeholder="Password" class="w-full bg-black/50 border border-white/15 rounded-xl px-4 py-2.5 text-sm mb-4 outline-none focus:border-amber-400 transition" />
          <button id="loginBtn" class="w-full gold-gradient text-black font-semibold py-2.5 rounded-xl text-sm hover:opacity-90 transition cursor-pointer">Enter Studio</button>
        </div>
      `;
      const doLogin = () => {
        if (document.getElementById("adminPassInput").value === ADMIN_PASSWORD) {
          sessionStorage.setItem("adminAuth", "true");
          renderAdminDashboard();
        } else {
          alert("Wrong password!");
        }
      };
      document.getElementById("loginBtn").onclick = doLogin;
      document.getElementById("adminPassInput").onkeydown = (e) => { if (e.key === "Enter") doLogin(); };
    }

    async function renderAdminDashboard() {
      document.getElementById("subTitle").innerText = "Studio Dashboard";
      document.getElementById("app").innerHTML = `
        <div class="grid lg:grid-cols-3 gap-6">
          <!-- CREATE GALLERY FORM -->
          <div class="glass-card p-6 rounded-3xl h-fit">
            <h2 class="font-serif-luxury text-xl font-bold mb-1">New Client Gallery</h2>
            <p class="text-xs text-zinc-400 mb-5">Auto-compresses & watermarks high-res JPGs.</p>
            <div class="space-y-4">
              <div>
                <label class="text-[11px] uppercase tracking-wider text-zinc-400">Client / Event Name</label>
                <input id="clientName" type="text" placeholder="e.g. Karthik & Priya Wedding" class="w-full mt-1.5 bg-black/50 border border-white/15 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-amber-400 transition" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-[11px] uppercase tracking-wider text-zinc-400">4-Digit PIN</label>
                  <input id="clientPin" type="text" placeholder="1234" class="w-full mt-1.5 bg-black/50 border border-white/15 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-amber-400 transition" />
                </div>
                <div>
                  <label class="text-[11px] uppercase tracking-wider text-zinc-400">Max Limit</label>
                  <input id="maxLimit" type="number" value="150" class="w-full mt-1.5 bg-black/50 border border-white/15 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-amber-400 transition" />
                </div>
              </div>
              <div>
                <label class="text-[11px] uppercase tracking-wider text-zinc-400">Select Photos</label>
                <input id="photoFiles" type="file" multiple accept="image/*" class="w-full mt-1.5 text-xs text-zinc-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-white/10 file:text-white hover:file:bg-white/20 cursor-pointer" />
              </div>
              <button id="uploadBtn" class="w-full gold-gradient text-black font-semibold py-3 rounded-xl text-sm hover:opacity-90 transition cursor-pointer">Upload & Create Gallery</button>
              <p id="uploadStatus" class="text-xs text-amber-400 text-center hidden"></p>
            </div>
          </div>

          <!-- EXISTING GALLERIES LIST -->
          <div class="lg:col-span-2 glass-card p-6 rounded-3xl">
            <div class="flex items-center justify-between mb-5">
              <h2 class="font-serif-luxury text-xl font-bold">Client Galleries</h2>
              <span class="text-xs text-zinc-500">Live Sync</span>
            </div>
            <div id="galleriesList" class="space-y-3 text-sm text-zinc-400">Loading galleries...</div>
          </div>
        </div>
      `;

      document.getElementById("uploadBtn").onclick = handleCreateGallery;
      loadAdminGalleries();
    }

    async function handleCreateGallery() {
      const name = document.getElementById("clientName").value.trim();
      const pin = document.getElementById("clientPin").value.trim();
      const maxLimit = parseInt(document.getElementById("maxLimit").value) || 150;
      const files = document.getElementById("photoFiles").files;
      const statusEl = document.getElementById("uploadStatus");
      const btn = document.getElementById("uploadBtn");

      if (!name || !pin || files.length === 0) {
        alert("Please fill Client Name, PIN, and select at least 1 photo.");
        return;
      }

      btn.disabled = true;
      btn.classList.add("opacity-50");
      statusEl.classList.remove("hidden");

      const uploadedPhotos = [];
      let failedCount = 0;
      let lastError = "";

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusEl.innerText = `Compressing & Uploading ${i + 1} / ${files.length} (${file.name})...`;

        try {
          const compressedBlob = await compressImage(file);
          const formData = new FormData();
          formData.append("file", compressedBlob, file.name);
          formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
            method: "POST",
            body: formData
          });
          const data = await res.json();

          if (data.secure_url) {
            uploadedPhotos.push({ url: data.secure_url, filename: file.name });
          } else {
            failedCount++;
            lastError = data.error ? data.error.message : "Upload rejected by Cloudinary";
          }
        } catch (err) {
          failedCount++;
          lastError = err.message;
        }
      }

      if (uploadedPhotos.length === 0) {
        alert(`Upload Failed! Reason: ${lastError}`);
        statusEl.classList.add("hidden");
        btn.disabled = false;
        btn.classList.remove("opacity-50");
        return;
      }

      statusEl.innerText = "Saving gallery...";
      await addDoc(collection(db, "galleries"), {
        name,
        pin,
        maxLimit,
        photos: uploadedPhotos,
        selected: [],
        starred: [],
        submitted: false,
        createdAt: Date.now()
      });

      alert(`Gallery Created! ${uploadedPhotos.length} photos uploaded.` + (failedCount > 0 ? ` (${failedCount} failed)` : ""));
      renderAdminDashboard();
    }

    async function loadAdminGalleries() {
      const listEl = document.getElementById("galleriesList");
      const snap = await getDocs(collection(db, "galleries"));
      if (snap.empty) {
        listEl.innerHTML = `<p class="text-zinc-500 py-8 text-center">No client galleries yet. Create your first one!</p>`;
        return;
      }

      const items = [];
      snap.forEach(d => items.push({ id: d.id, ...d.data() }));
      items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      listEl.innerHTML = items.map(g => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?gallery=${g.id}`;
        const selCount = (g.selected || []).length;
        const starCount = (g.starred || []).length;
        const badge = g.submitted
          ? `<span class="bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 text-[10px] uppercase tracking-wider px-2.5 py-0.5 rounded-full">Submitted</span>`
          : `<span class="bg-amber-500/15 text-amber-400 border border-amber-500/30 text-[10px] uppercase tracking-wider px-2.5 py-0.5 rounded-full">In Progress</span>`;

        return `
          <div class="bg-black/40 border border-white/10 hover:border-white/20 p-4 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4 transition">
            <div>
              <div class="flex items-center gap-2.5">
                <h3 class="font-semibold text-white text-base">${g.name}</h3>
                ${badge}
              </div>
              <p class="text-xs text-zinc-400 mt-1.5">
                PIN: <span class="text-white font-mono">${g.pin}</span> &bull;
                Photos: <span class="text-white">${g.photos.length}</span> &bull;
                Selected: <span class="text-amber-400 font-semibold">${selCount} / ${g.maxLimit}</span> &bull;
                ★ Covers: <span class="text-yellow-300 font-semibold">${starCount}</span>
              </p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="copyLink('${shareUrl}')" class="bg-white/10 hover:bg-white/20 text-white text-xs px-3 py-2 rounded-xl transition cursor-pointer">Copy Link</button>
              <button onclick="exportLightroom('${g.id}')" class="gold-gradient text-black font-semibold text-xs px-3 py-2 rounded-xl hover:opacity-90 transition cursor-pointer">Export All</button>
              <button onclick="exportStarred('${g.id}')" class="bg-yellow-500/15 hover:bg-yellow-500/30 text-yellow-300 border border-yellow-500/30 text-xs px-3 py-2 rounded-xl transition cursor-pointer">★ Covers</button>
              <button onclick="deleteGallery('${g.id}')" class="bg-red-500/15 hover:bg-red-500/30 text-red-300 text-xs px-3 py-2 rounded-xl transition cursor-pointer">Delete</button>
            </div>
          </div>
        `;
      }).join("");
    }

    window.copyLink = (url) => {
      navigator.clipboard.writeText(url);
      alert("Client link copied! Share it on WhatsApp.");
    };

    window.exportLightroom = async (id) => {
      const snap = await getDoc(doc(db, "galleries", id));
      if (!snap.exists()) return;
      const g = snap.data();
      const selected = g.selected || [];
      if (selected.length === 0) {
        alert("Client hasn't selected any photos yet.");
        return;
      }
      const lightroomList = selected.map(f => f.replace(/\.[^/.]+$/, "")).join(", ");
      navigator.clipboard.writeText(lightroomList);
      alert(`Copied ${selected.length} selected filenames for Lightroom:\n\n${lightroomList}`);
    };

    window.exportStarred = async (id) => {
      const snap = await getDoc(doc(db, "galleries", id));
      if (!snap.exists()) return;
      const g = snap.data();
      const starred = g.starred || [];
      if (starred.length === 0) {
        alert("Client hasn't marked any Album Cover / Frame photos yet.");
        return;
      }
      const lightroomList = starred.map(f => f.replace(/\.[^/.]+$/, "")).join(", ");
      navigator.clipboard.writeText(lightroomList);
      alert(`Copied ${starred.length} Album Cover / Frame filenames:\n\n${lightroomList}`);
    };

    window.deleteGallery = async (id) => {
      if (!confirm("Delete this gallery from dashboard?")) return;
      await deleteDoc(doc(db, "galleries", id));
      loadAdminGalleries();
    };

    // =========================================================
    // CLIENT SECTION
    // =========================================================
    async function loadClientGallery(id) {
      const snap = await getDoc(doc(db, "galleries", id));
      if (!snap.exists()) {
        document.getElementById("app").innerHTML = `<p class="text-center py-24 text-zinc-400">Gallery not found.</p>`;
        return;
      }
      currentGallery = { id: snap.id, ...snap.data() };
      selectedSet = new Set(currentGallery.selected || []);
      starredSet = new Set(currentGallery.starred || []);
      document.getElementById("subTitle").innerText = currentGallery.name;

      renderPinScreen();
    }

    function renderPinScreen() {
      document.getElementById("app").innerHTML = `
        <div class="max-w-sm mx-auto mt-16 glass-card p-8 rounded-3xl text-center">
          ${getLogoHtml("h-16")}
          <p class="text-[11px] uppercase tracking-[0.25em] text-amber-400 mb-1">Private Collection</p>
          <h2 class="font-serif-luxury text-2xl font-bold text-white mb-2">${currentGallery.name}</h2>
          <p class="text-xs text-zinc-400 mb-6">Enter your 4-digit PIN to unlock your gallery</p>
          <input id="pinInput" type="password" maxlength="6" placeholder="• • • •" class="w-full text-center tracking-[0.5em] bg-black/50 border border-white/15 rounded-xl px-4 py-3 text-lg mb-4 outline-none focus:border-amber-400 transition" />
          <button id="unlockBtn" class="w-full gold-gradient text-black font-semibold py-3 rounded-xl text-sm hover:opacity-90 transition cursor-pointer">Unlock Gallery</button>
        </div>
      `;
      const unlock = () => {
        if (document.getElementById("pinInput").value.trim() === currentGallery.pin) {
          renderClientPhotos();
        } else {
          alert("Incorrect PIN!");
        }
      };
      document.getElementById("unlockBtn").onclick = unlock;
      document.getElementById("pinInput").onkeydown = (e) => { if (e.key === "Enter") unlock(); };
    }

    window.setFilter = (filterType) => {
      activeFilter = filterType;
      renderClientPhotos();
    };

    function renderClientPhotos() {
      updateClientHeader();
      const allPhotos = currentGallery.photos || [];
      const count = selectedSet.size;
      const starCount = starredSet.size;
      const limit = currentGallery.maxLimit;
      const pct = Math.min(100, Math.round((count / limit) * 100));

      let displayPhotos = allPhotos.map((p, i) => ({ ...p, origIdx: i }));
      if (activeFilter === "selected") {
        displayPhotos = displayPhotos.filter(p => selectedSet.has(p.filename));
      } else if (activeFilter === "starred") {
        displayPhotos = displayPhotos.filter(p => starredSet.has(p.filename));
      }

      document.getElementById("app").innerHTML = `
        <!-- GALLERY BANNER & FILTER -->
        <div class="mb-6 flex flex-col sm:flex-row sm:items-end justify-between gap-4 pb-5 border-b border-white/10">
          <div>
            <p class="text-[11px] uppercase tracking-[0.25em] text-amber-400 mb-1">Photo Selection</p>
            <h2 class="font-serif-luxury text-2xl sm:text-3xl font-bold text-white">${currentGallery.name}</h2>
            <p class="text-[11px] text-zinc-400 mt-1">Tap <span class="text-amber-400">♥</span> to select for album &bull; Tap <span class="text-yellow-300">★</span> for Cover / Wall Frame</p>
            <div class="mt-3 w-full sm:w-64 h-1.5 bg-white/10 rounded-full overflow-hidden">
              <div class="h-full gold-gradient transition-all duration-300" style="width: ${pct}%"></div>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-1.5 bg-white/5 p-1 rounded-xl border border-white/10 w-fit">
            <button onclick="setFilter('all')" class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition cursor-pointer ${activeFilter === 'all' ? 'bg-white text-black' : 'text-zinc-400 hover:text-white'}">
              All (${allPhotos.length})
            </button>
            <button onclick="setFilter('selected')" class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition cursor-pointer ${activeFilter === 'selected' ? 'gold-gradient text-black font-semibold' : 'text-zinc-400 hover:text-white'}">
              ♥ Selected (${count})
            </button>
            <button onclick="setFilter('starred')" class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition cursor-pointer ${activeFilter === 'starred' ? 'bg-yellow-400 text-black font-semibold' : 'text-zinc-400 hover:text-white'}">
              ★ Cover/Frame (${starCount})
            </button>
          </div>
        </div>

        ${displayPhotos.length === 0
          ? `<p class="text-center py-20 text-zinc-500 text-sm">No photos in this section yet.</p>`
          : `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
              ${displayPhotos.map(p => {
                const isSel = selectedSet.has(p.filename);
                const isStar = starredSet.has(p.filename);
                return `
                  <div class="relative group bg-zinc-900 rounded-2xl overflow-hidden cursor-pointer transition-all duration-200 ${isSel ? 'selected-ring' : 'border border-white/5 hover:border-white/20'}">
                    <div class="overflow-hidden aspect-square">
                      <img src="${p.url}" loading="lazy" onclick="openLightbox(${p.origIdx})" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                    </div>
                    <!-- STAR (COVER/FRAME) BUTTON -->
                    <button onclick="toggleStar(${p.origIdx}, event)" title="Mark as Album Cover / Frame" class="absolute top-2.5 left-2.5 w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-xl backdrop-blur-md transition cursor-pointer ${isStar ? 'bg-yellow-400 text-black scale-105' : 'bg-black/50 text-white/80 hover:bg-yellow-400 hover:text-black'}">
                      ★
                    </button>
                    <!-- HEART (SELECT) BUTTON -->
                    <button onclick="toggleSelect(${p.origIdx}, event)" title="Select Photo" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-xl backdrop-blur-md transition cursor-pointer ${isSel ? 'gold-gradient text-black scale-105' : 'bg-black/50 text-white hover:bg-amber-400 hover:text-black'}">
                      ♥
                    </button>
                    <div class="px-3 py-2 text-[10px] text-zinc-400 truncate bg-zinc-950/90 flex items-center justify-between">
                      <span class="truncate">${p.filename}</span>
                      <span class="flex items-center gap-1 ml-1">
                        ${isStar ? '<span class="text-yellow-300 font-bold">★</span>' : ''}
                        ${isSel ? '<span class="text-amber-400 font-semibold">✓</span>' : ''}
                      </span>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>`
        }
      `;
    }

    function updateClientHeader() {
      const count = selectedSet.size;
      const limit = currentGallery.maxLimit;
      document.getElementById("headerActions").innerHTML = `
        <div class="bg-white/5 border border-white/10 px-3 py-1.5 rounded-full text-xs font-medium">
          <span class="text-amber-400 font-bold">${count}</span> <span class="text-zinc-400">/ ${limit}</span>
        </div>
        <button onclick="submitSelection()" class="gold-gradient text-black text-xs font-semibold px-4 py-1.5 rounded-full hover:opacity-90 transition cursor-pointer">
          ${currentGallery.submitted ? 'Update Submit' : 'Final Submit'}
        </button>
      `;
    }

    window.toggleSelect = async (idx, e) => {
      if (e) e.stopPropagation();
      const filename = currentGallery.photos[idx].filename;
      if (selectedSet.has(filename)) {
        selectedSet.delete(filename);
      } else {
        if (selectedSet.size >= currentGallery.maxLimit) {
          alert(`You have reached the maximum limit of ${currentGallery.maxLimit} photos.`);
          return;
        }
        selectedSet.add(filename);
      }
      renderClientPhotos();
      await updateDoc(doc(db, "galleries", currentGallery.id), {
        selected: Array.from(selectedSet)
      });
    };

    window.toggleStar = async (idx, e) => {
      if (e) e.stopPropagation();
      const filename = currentGallery.photos[idx].filename;
      if (starredSet.has(filename)) {
        starredSet.delete(filename);
      } else {
        starredSet.add(filename);
      }
      renderClientPhotos();
      await updateDoc(doc(db, "galleries", currentGallery.id), {
        starred: Array.from(starredSet)
      });
    };

    window.submitSelection = async () => {
      if (!confirm(`Submit ${selectedSet.size} selected photos (${starredSet.size} Cover/Frame) to ${STUDIO_NAME}?`)) return;
      await updateDoc(doc(db, "galleries", currentGallery.id), {
        selected: Array.from(selectedSet),
        starred: Array.from(starredSet),
        submitted: true
      });
      currentGallery.submitted = true;
      updateClientHeader();
      alert("Thank you! Your photo selection has been submitted.");
    };

    // =========================================================
    // LIGHTBOX + KEYBOARD + MOBILE SWIPE SUPPORT
    // =========================================================
    window.openLightbox = (idx) => {
      lightboxIndex = idx;
      updateLightboxUI();
      document.getElementById("lightbox").classList.remove("hidden");
      document.getElementById("lightbox").classList.add("flex");
    };

    window.closeLightbox = () => {
      document.getElementById("lightbox").classList.add("hidden");
      document.getElementById("lightbox").classList.remove("flex");
    };

    window.prevPhoto = () => {
      lightboxIndex = (lightboxIndex - 1 + currentGallery.photos.length) % currentGallery.photos.length;
      updateLightboxUI();
    };

    window.nextPhoto = () => {
      lightboxIndex = (lightboxIndex + 1) % currentGallery.photos.length;
      updateLightboxUI();
    };

    window.toggleCurrentLightboxSelect = async () => {
      await window.toggleSelect(lightboxIndex);
      updateLightboxUI();
    };

    window.toggleCurrentLightboxStar = async () => {
      await window.toggleStar(lightboxIndex);
      updateLightboxUI();
    };

    document.addEventListener("keydown", (e) => {
      const lb = document.getElementById("lightbox");
      if (lb.classList.contains("hidden")) return;
      if (e.key === "Escape") window.closeLightbox();
      if (e.key === "ArrowLeft") window.prevPhoto();
      if (e.key === "ArrowRight") window.nextPhoto();
    });

    // --- MOBILE TOUCH SWIPE ---
    let touchStartX = 0;
    const lbEl = document.getElementById("lightbox");
    lbEl.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    lbEl.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) window.nextPhoto();
        else window.prevPhoto();
      }
    }, { passive: true });

    function updateLightboxUI() {
      const p = currentGallery.photos[lightboxIndex];
      document.getElementById("lightboxImg").src = p.url;
      document.getElementById("lightboxFilename").innerText = `${p.filename}  •  ${lightboxIndex + 1} / ${currentGallery.photos.length}`;

      const selBtn = document.getElementById("lightboxSelectBtn");
      if (selectedSet.has(p.filename)) {
        selBtn.innerText = "♥ Selected";
        selBtn.className = "px-5 py-2 rounded-full font-semibold text-xs uppercase tracking-wider gold-gradient text-black transition cursor-pointer";
      } else {
        selBtn.innerText = "♥ Select";
        selBtn.className = "px-5 py-2 rounded-full font-semibold text-xs uppercase tracking-wider bg-white/10 hover:bg-amber-400 hover:text-black text-white transition cursor-pointer";
      }

      const starBtn = document.getElementById("lightboxStarBtn");
      if (starredSet.has(p.filename)) {
        starBtn.innerText = "★ Cover / Frame";
        starBtn.className = "px-5 py-2 rounded-full font-semibold text-xs uppercase tracking-wider bg-yellow-400 text-black transition cursor-pointer";
      } else {
        starBtn.innerText = "★ Cover / Frame";
        starBtn.className = "px-5 py-2 rounded-full font-semibold text-xs uppercase tracking-wider bg-white/10 hover:bg-yellow-400 hover:text-black text-white transition cursor-pointer";
      }
    }
  </script>
</body>
</html>
